race:
  target_date: 2026-12-31     # change to a real race date if you pick one
  goal_time: "1:59:59"        # stretch
  acceptable_time: "2:29:59"
  last_result: "3:39"

primary_goal: "Visible abs by end of 2026"   # mandatory; the race is best-effort

current:
  continuous_run_min: 20      # update
  longest_session_km: 11.6    # update

schedule:
  preferred_time: morning
  days_available: 7
  max_hard_days_per_week: 2   # HIIT or tempo
  rest_days_per_week: 1
  readiness_floor: 70         # below this: walk or rest only (enforced in code)

rules:
  - "Low readiness (<70): walk or rest only"
  - "Never two hard days back to back"
  - "Long run on weekends"

nutrition:                    # targets computed in code from Oura personal_info (age, weight, height, sex)
  diet: vegetarian
  cuisine: "Indian preferred"
  weight_kg: null             # optional override if Oura's weight is stale
  activity_factor: 1.55       # x BMR (Mifflin-St Jeor); fixed, not from active calories
  deficit_kcal: 400           # body-composition goal: visible abs
  protein_g_per_kg: 1.8
  fat_pct: 25                 # % of calories; carbs = the rest
  fiber_g_per_1000kcal: 14

recent_food_caps:             # enforced in code; strictest match wins
  - {within_min: 60,  min_calories: 400, max_intensity: 2}   # real meal in the last hour
  - {within_min: 120, min_calories: 400, max_intensity: 3}   # real meal in the last 2 h
  - {within_min: 30,  min_calories: 150, max_intensity: 3}   # snack in the last 30 min

activity:
  hard_oura:                  # Oura workouts that count as a hard day
    running: {min_minutes: 60}
  walk_counts:                # walk of 20+ min = light workout, never hard
    min_minutes: 20
    not_on_bands: [PUSH]      # on PUSH days walks don't count toward "worked out today"

          - {discipline: cross, type: cross, amount: 60, at: -6}
          - {discipline: run, type: easy, amount: 5, at: -5}
          - {discipline: run, type: easy, amount: 8, at: -4}
          - {discipline: run, type: easy, amount: 5, at: -3}
          - {discipline: run, type: race_test, amount: 6.214, at: 0}     # 10-K race
      - phase: peak
        sessions:
          - {discipline: run, type: easy, amount: 5, at: -5}
          - {discipline: run, type: pace, amount: 8, at: -4}
          - {discipline: run, type: easy, amount: 5, at: -3}
          - {discipline: run, type: pace, amount: 5, at: -1}
          - {discipline: run, type: long, amount: 11, at: 0}
      - phase: peak
        sessions:

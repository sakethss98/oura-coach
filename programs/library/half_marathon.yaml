          - {discipline: run, type: easy, amount: 3.5, at: -5}
          - {discipline: run, type: pace, amount: 5, at: -4}
          - {discipline: run, type: easy, amount: 3.5, at: -3}
          - {discipline: run, type: easy, amount: 3, at: -1}
          - {discipline: run, type: long, amount: 7, at: 0}
      - phase: build
        sessions:
          - {discipline: cross, type: cross, amount: 40, at: -6}
          - {discipline: run, type: easy, amount: 4, at: -5}
          - {discipline: run, type: easy, amount: 6, at: -4}
          - {discipline: run, type: easy, amount: 4, at: -3}
          - {discipline: run, type: pace, amount: 3, at: -1}
          - {discipline: run, type: long, amount: 8, at: 0}
      - phase: build

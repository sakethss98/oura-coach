          - {discipline: run, type: easy, amount: 4, at: -3}
          - {discipline: run, type: pace, amount: 3, at: -1}
          - {discipline: run, type: long, amount: 12, at: 0}
      - phase: taper
        sessions:
          - {discipline: run, type: easy, amount: 4, at: -5}
          - {discipline: run, type: pace, amount: 4, at: -4}
          - {discipline: run, type: easy, amount: 2, at: -3}
          - {discipline: run, type: race, amount: 13.1094, at: 0}        # the half marathon


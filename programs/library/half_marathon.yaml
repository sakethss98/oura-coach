          - {discipline: run, type: pace, amount: 6, at: -4}
          - {discipline: run, type: easy, amount: 4, at: -3}
          - {discipline: run, type: race_test, amount: 3.107, at: 0}     # 5-K race
      - phase: build
        sessions:
